name: Android APK (Debug) - codex

on:
  push:
    branches:
      - "codex/2026-01-15/12-10-17/review-project-for-application-issues"
  workflow_dispatch:

concurrency:
  group: apk-debug-codex
  cancel-in-progress: true

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dkotlin.compiler.execution.strategy=in-process
        -Dkotlin.incremental=true
        -Dkotlin.daemon.jvmargs=-Xmx2g
        -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fix DNS for Maven repositories
        run: |
          sudo bash -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      # Caché extra (más agresiva) para Gradle:
      - name: Cache Gradle (wrapper + caches)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >
            ${{ runner.os }}-gradle-
            ${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Warm Gradle cache
        run: ./gradlew --no-daemon --stacktrace help

      # Recomendado para CI: evita daemon y reduce “ruido”
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --parallel --stacktrace

      - name: Set APK artifact name
        id: apk_name
        shell: bash
        run: |
          VERSION_NAME=$(./gradlew -q :app:properties --no-daemon | awk -F': ' '/^versionName/ {print $2}' | tr -d '\r')
          VERSION_CODE=$(./gradlew -q :app:properties --no-daemon | awk -F': ' '/^versionCode/ {print $2}' | tr -d '\r')
          echo "name=open-video-editor-${VERSION_NAME}(${VERSION_CODE})-debug-apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_name.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk # Mejorar
